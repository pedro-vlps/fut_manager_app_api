name: API tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Do not cancel push runs: Railway must receive a completed test result for each commit.
jobs:
  tests:
    name: Python 3.13 / PostgreSQL 17
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          # Public, disposable test credential; matches scripts.run_feedback_tests.
          POSTGRES_PASSWORD: ${{ 'isolated-test-only' }}
        ports:
          - 55439:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Poetry
        run: python -m pip install poetry==2.3.3
      - name: Install locked dependencies
        run: poetry install --with dev --no-root --no-interaction
      - name: Run complete suite with isolated database and ephemeral keys
        run: poetry run python -m scripts.run_feedback_tests
