services:
  api:
    build:
      context: .
    command: python -m uvicorn src.__main__:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    volumes:
      - ./src:/app/src
    environment:
      FUT_MANAGER_APP_NAME: Fut Manager API
      FUT_MANAGER_DEBUG: "false"
      FUT_MANAGER_DOCS_ENABLED: "${FUT_MANAGER_DOCS_ENABLED:-true}"
      FUT_MANAGER_DATABASE_HOST: ${FUT_MANAGER_DATABASE_HOST}
      FUT_MANAGER_DATABASE_PORT: ${FUT_MANAGER_DATABASE_PORT}
      FUT_MANAGER_DATABASE_NAME: ${FUT_MANAGER_DATABASE_NAME}
      FUT_MANAGER_DATABASE_USER: ${FUT_MANAGER_DATABASE_USER}
      FUT_MANAGER_DATABASE_PASSWORD: ${FUT_MANAGER_DATABASE_PASSWORD}
      FUT_MANAGER_DATABASE_ECHO: "false"
      FUT_MANAGER_CREATE_SCHEMA_ON_STARTUP: "true"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${FUT_MANAGER_DATABASE_NAME}
      POSTGRES_USER: ${FUT_MANAGER_DATABASE_USER}
      POSTGRES_PASSWORD: ${FUT_MANAGER_DATABASE_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
    # Externo para sobreviver inclusive a docker compose down -v.
    external: true
    name: ${FUT_MANAGER_DATABASE_VOLUME}
